{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="description" content="{% block meta_description %}Kararsızım — İnsanların kararsız kaldığı konularda birbirine danışabildiği, anonim oy kullanılabilen anket platformu.{% endblock %}">

  <!-- Open Graph / Sosyal Medya -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kararsızım">
  <meta property="og:title" content="{% block og_title %}{% block title %}Kararsızım — Neye karar veremiyorsun?{% endblock %}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Kararsız kaldığın soruları sor, topluluk oylasın!{% endblock %}">

  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include 'partials/navbar.html' %}
  {% include 'partials/messages.html' %}

  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 <strong>kararsızım</strong> 🤔 · Kararsız kaldığın konularda topluluğa danış.</p>
      <div class="footer-links">
        <a href="{% url 'polls:home' %}">Ana Sayfa</a>
        <a href="{% url 'polls:create' %}">Anket Oluştur</a>
      </div>
    </div>
  </footer>

  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
