<header class="navbar">
  <div class="container navbar-container">
    <a href="{% url 'polls:home' %}" class="brand-logo">
      <span>kararsızım</span> 🤔
    </a>

    <nav class="nav-actions">
      {% if user.is_authenticated %}
        <a href="/anket/yeni/" class="btn btn-primary btn-sm">
          <span>＋ Anket oluştur</span>
        </a>
        <a href="{% url 'accounts:profile' user.username %}" class="nav-user-link">
          @{{ user.username }}
        </a>
        <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm">Çıkış</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-sm">Giriş yap</a>
        <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">Üye ol</a>
      {% endif %}
    </nav>
  </div>
</header>
