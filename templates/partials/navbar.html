{% load static %}
<header class="navbar qp-navbar">
  <div class="container navbar-container">
    <div class="navbar-left">
      <a href="{% url 'polls:home' %}" class="qp-brand-logo">
        <span class="qp-logo-badge">?</span>
        <span class="qp-logo-text">kararsızım</span>
      </a>
      <nav class="qp-nav-links">
        <a href="{% url 'polls:home' %}" class="qp-nav-link active">Anketler</a>
        <a href="#nasil-calisir" class="qp-nav-link">Nasıl Çalışır?</a>
        <a href="#populer" class="qp-nav-link">Popüler</a>
      </nav>
    </div>

    <nav class="nav-actions">
      {% if user.is_authenticated %}
        <a href="{% url 'polls:create' %}" class="btn btn-orange btn-sm">
          <span>＋ Yeni Anket</span>
        </a>
        <a href="{% url 'accounts:profile' user.username %}" class="nav-user-link">
          <span class="user-avatar-mini">{{ user.username|slice:":1"|upper }}</span>
          @{{ user.username }}
        </a>
        <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm">Çıkış</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="btn btn-text-nav btn-sm">Giriş Yap</a>
        <a href="{% url 'accounts:register' %}" class="btn btn-qp-blue btn-sm btn-uppercase">Ücretsiz Kayıt Ol</a>
      {% endif %}
    </nav>
  </div>
</header>
